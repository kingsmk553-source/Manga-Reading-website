<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171321">
  <title>เข้าสู่ระบบ | Manga Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: #171321;
    }
    .card {
      width: min(420px, 100%);
      padding: 28px;
      background: #252033;
      border: 1px solid #3d3353;
      border-radius: 18px;
    }
    h1 { margin-top: 0; text-align: center; }
    p { color: #c4b5fd; line-height: 1.7; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #514466;
      background: #171321;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: #7c3aed;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.secondary { background: #403451; }
    #message { overflow-wrap: anywhere; }
    a { color: #c4b5fd; }
    .back { text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>📖 Manga Studio</h1>
    <p>เข้าสู่ระบบเพื่อใช้บัญชีของคุณ หรือสมัครสมาชิกใหม่</p>

    <form id="authForm">
      <label for="email">อีเมล</label>
      <input id="email" type="email" autocomplete="email" required>

      <label for="password">รหัสผ่าน</label>
      <input id="password" type="password"
        autocomplete="current-password" minlength="6" required>

      <button type="submit" id="loginButton">เข้าสู่ระบบ</button>
      <button type="button" class="secondary" id="signupButton">
        สมัครสมาชิก
      </button>
      <button type="button" class="secondary" id="logoutButton" hidden>
        ออกจากระบบ
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p class="back"><a href="index.html">← กลับหน้าหลัก</a></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL =
      'https://uksrlcpcusrqnjunqglc.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_gpTZTA1PRd6o2mLTS1MgHA_PAgpgtfT';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById('authForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const loginButton = document.getElementById('loginButton');
    const signupButton = document.getElementById('signupButton');
    const logoutButton = document.getElementById('logoutButton');

    function showMessage(text) {
      message.textContent = text;
    }

    async function updateStatus() {
      const { data, error } = await supabase.auth.getUser();

      if (error) console.error(error);

      if (data.user) {
        showMessage('เข้าสู่ระบบแล้ว: ' + data.user.email);
        loginButton.hidden = true;
        signupButton.hidden = true;
        logoutButton.hidden = false;
      } else {
        loginButton.hidden = false;
        signupButton.hidden = false;
        logoutButton.hidden = true;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showMessage('กำลังเข้าสู่ระบบ...');

      const { error } = await supabase.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) {
        showMessage('เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบอีเมลและรหัสผ่าน');
        console.error(error);
        return;
      }

      await updateStatus();
    });

    signupButton.addEventListener('click', async () => {
      showMessage('กำลังสมัครสมาชิก...');

      const { data, error } = await supabase.auth.signUp({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) {
        showMessage('สมัครสมาชิกไม่สำเร็จ กรุณาตรวจสอบข้อมูล');
        console.error(error);
        return;
      }

      if (data.session) {
        showMessage('สมัครสมาชิกสำเร็จและเข้าสู่ระบบแล้ว');
      } else {
        showMessage('สมัครสมาชิกแล้ว กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชี');
      }

      await updateStatus();
    });

    logoutButton.addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();

      if (error) {
        showMessage('ออกจากระบบไม่สำเร็จ');
        console.error(error);
        return;
      }

      showMessage('ออกจากระบบแล้ว');
      await updateStatus();
    });

    updateStatus();
  </script>
</body>
</html>
